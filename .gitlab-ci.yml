stages:
  - build
  - test

variables:
  NPM_TOKEN: $NPM_TOKEN
  NODE_ENV: production

build:
  stage: build
  image: node:$NODE_VERSION
  script:
    - npm install -g typescript  # Installe TypeScript globalement
    - npm install  # Installe les dépendances
    - npm run build  # Exécute la commande de compilation
  only:
    - main
  parallel:
    matrix:
      - NODE_VERSION: ["14", "16", "18", "20", "22"]

test:
  stage: test
  image: node:$NODE_VERSION
  script:
    - npm test  # Exécute les tests
  only:
    - main
  parallel:
    matrix:
      - NODE_VERSION: ["14", "16", "18", "20", "22"]
